[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-job-posting-analytics"
version = "1.0.0"
description = "A source-audited reanalysis of recorded LinkedIn job applications"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.5",
  "glum>=3.0", "xgboost>=2.1", "statsmodels>=0.14", "matplotlib>=3.8",
  "pyarrow>=16", "threadpoolctl>=3.5",
]

[project.optional-dependencies]
download = ["kagglehub>=0.3"]
notebook = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29"]
report = ["reportlab>=4.0", "pillow>=10"]
test = ["pytest>=8"]

[project.scripts]
linkedin-analytics = "linkedin_analytics.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
